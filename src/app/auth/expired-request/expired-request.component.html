<div class="image-background">
  <div class="oficina_v">
    <img src="assets/oficina_virtual.png" alt="oficina_virtual" class="image_oficina" />
  </div>
  <div class="cuadros">
    <div class="diamond diamond1"></div>
    <div class="diamond diamond2"></div>
    <div class="diamond diamond3"></div>
  </div>
</div>
<div class="container">
  <p-dialog

    [(visible)]="display"
    [modal]="true"
    [closable]="false"
    [draggable]="false"
    [style]="{'width': '50%', 'max-width': '500px'}"
    [contentStyle]="{'text-align': 'center'}">

    <p>
      Lo sentimos pero la solicitud para restablecer tu contraseña no pudo ser procesada, por favor inténtalo nuevamente.
    </p>

    <div style="text-align: center; margin-top: 20px;">
      <a class="btn btn-secondary" (click)="redirectToLogin()">Retornar</a>
    </div>
  </p-dialog>
</div>
